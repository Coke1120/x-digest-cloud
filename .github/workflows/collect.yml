name: Check and collect X digest template

on:
  workflow_dispatch:
    inputs:
      collect:
        description: 'Collect and upload evidence to the configured private store'
        type: boolean
        required: true
        default: false
  schedule:
    - cron: '15 0 * * *'
  pull_request:
  push:
    branches: [main]
    paths:
      - '.github/workflows/collect.yml'
      - 'scripts/**'
      - 'examples/**'
      - 'requirements.txt'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install the pinned read-only source CLI
        run: python -m pip install -r requirements.txt
      - name: Test without credentials
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s scripts -p 'test_*.py'
  collect:
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.collect))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: private-digest-collection
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Check private destination configuration without disclosure
        env:
          DIGEST_UPLOAD_URL: ${{ secrets.DIGEST_UPLOAD_URL }}
          DIGEST_UPLOAD_TOKEN: ${{ secrets.DIGEST_UPLOAD_TOKEN }}
          DIGEST_SOURCE_POOL_JSON: ${{ secrets.DIGEST_SOURCE_POOL_JSON }}
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, 'scripts')
          from upload_snapshot import endpoint_url
          try:
              endpoint_url(os.environ.get('DIGEST_UPLOAD_URL'))
              assert os.environ.get('DIGEST_UPLOAD_TOKEN') and os.environ.get('DIGEST_SOURCE_POOL_JSON')
          except Exception:
              raise SystemExit('private_collection_unconfigured') from None
          PY
      - name: Install the pinned read-only source CLI
        run: python -m pip install -r requirements.txt
      - name: Collect privately with no evidence in logs or artifacts
        env:
          DIGEST_SOURCE_POOL_JSON: ${{ secrets.DIGEST_SOURCE_POOL_JSON }}
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
          TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}
        run: python scripts/collect_private.py
      - name: Upload to the collector-only private API
        env:
          DIGEST_UPLOAD_URL: ${{ secrets.DIGEST_UPLOAD_URL }}
          DIGEST_UPLOAD_TOKEN: ${{ secrets.DIGEST_UPLOAD_TOKEN }}
        run: python scripts/upload_snapshot.py --snapshot "$RUNNER_TEMP/x-digest-private/snapshot.json" --source-health "$RUNNER_TEMP/x-digest-private/source-health.json"
      - name: Remove ephemeral private files
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/x-digest-private" "/tmp/x-digest-raw-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
