name: Collect X sources

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/collect.yml'
      - 'scripts/**'
      - 'requirements.txt'

permissions:
  contents: read

concurrency:
  group: x-source-collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install the pinned read-only source CLI
        run: python -m pip install -r requirements.txt
      - name: Check selection and collection behavior without credentials
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python scripts/test_selection.py
          python scripts/test_snapshot.py
          python scripts/test_official_sources.py
      - name: Verify login and gather real X sources
        env:
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
          TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}
        run: python scripts/gather.py --n 50 --user-n 12 --out-dir /tmp/x-digest-raw-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Prefilter candidates and retain full evidence
        run: |
          python scripts/prefilter.py /tmp/x-digest-raw-${{ github.run_id }}-${{ github.run_attempt }} -o work/candidates.jsonl --hours 26 --limit 450
          python scripts/official_sources.py --output work/official-sources.json
          python scripts/snapshot.py --official work/official-sources.json --raw /tmp/x-digest-raw-${{ github.run_id }}-${{ github.run_attempt }} --candidates work/candidates.jsonl --output data/latest.json
          python scripts/source_health.py --snapshot data/latest.json --output data/source_health.json
      - name: Save the private source snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json data/source_health.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified X source snapshot'
            git push origin HEAD:main
          fi

